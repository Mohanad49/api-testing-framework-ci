name: API Evidence Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Nightly. This suite already emits JUnit, so the only thing it was missing to
  # be useful for flake detection was runs.
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: 20

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a scheduled run. On a pull request a superseded run is waste; on
  # a schedule it is a data point the flake detection is counting, and cancelling
  # it silently removes evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-tests:
    name: Run Newman API Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postman collection with Newman
        run: npm run test:api

      - name: Build static report hub
        if: always()
        run: npm run build:report-hub

      - name: Upload raw test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-evidence
          path: |
            reports/newman
            public
          retention-days: 14

      # Feed this run into TestPulse, which is what puts this suite on the
      # public dashboard at testpulse-eight.vercel.app.
      #
      # always(), because a failing run is the data point that matters most -
      # skipping ingest on red would mean the flake history only ever sees green.
      #
      # Not on pull requests: branches that may never merge would pollute the
      # history, and the flake numbers would end up describing code nobody runs.
      - name: Record the run in TestPulse
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: Mohanad49/testpulse@main
        with:
          # Newman writes one testcase per assertion rather than per request, so
          # a "test" here is an assertion. That is fine as long as it stays
          # consistent - the names are stable, which is what history joining
          # actually needs.
          path: reports/newman/junit.xml
          format: junit
          suite: restful-booker-api
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          dashboard-url: https://testpulse-eight.vercel.app
          comment: "false"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    name: Deploy Evidence Hub
    if: github.event_name != 'pull_request'
    needs: api-tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Repeat runs of one unchanged commit, on a schedule only.
  #
  # Newman already writes JUnit, so this suite needed nothing but runs. Three
  # against the same SHA give the same-commit strategy something to compare;
  # without repetition it can only ever report "no evidence".
  #
  # Separate from `api-tests` because that job builds and publishes the report
  # hub, and parallel copies would race on Pages.
  repeat:
    name: Repeat run ${{ matrix.attempt }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # A failing run is the data being collected, not a broken pipeline.
      - name: Run Postman collection with Newman
        continue-on-error: true
        run: npm run test:api

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-attempt-${{ matrix.attempt }}
          path: reports/
          retention-days: 30

      # Each attempt is stored as its own run. TestPulse's natural key includes
      # the start time, so three runs of one unchanged commit do not collapse
      # into one - which is the entire reason this job exists.
      - name: Record the run in TestPulse
        if: always()
        continue-on-error: true
        uses: Mohanad49/testpulse@main
        with:
          path: reports/newman/junit.xml
          format: junit
          suite: restful-booker-api
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          dashboard-url: https://testpulse-eight.vercel.app
          comment: "false"
